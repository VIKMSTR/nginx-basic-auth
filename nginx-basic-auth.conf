server {
    listen ${BIND_PORT} default_server;
    client_max_body_size 100M;
    location / {
        auth_basic             "Restricted";
        auth_basic_user_file   .htpasswd;

        proxy_pass             ${FORWARD_PROTOCOL}://${FORWARD_HOST}:${FORWARD_PORT};
        proxy_read_timeout     900;

        proxy_http_version 1.1;
		proxy_set_header Upgrade ${DOLLAR}http_upgrade;
		#proxy_set_header Connection ${DOLLAR}connection_upgrade;
		proxy_set_header Connection "Keep-Alive";
		proxy_set_header Proxy-Connection "Keep-Alive";
		proxy_redirect off;
		proxy_set_header   Origin    ${DOLLAR}host:${DOLLAR}server_port;
        proxy_set_header   Referer    ${DOLLAR}host:${DOLLAR}server_port;
        proxy_set_header    Host                    ${DOLLAR}host;
        proxy_set_header    X-Real-IP               ${DOLLAR}remote_addr;
        proxy_set_header    X-Forwarded-Host       ${DOLLAR}host:${DOLLAR}server_port;
        proxy_set_header    X-Forwarded-Server      ${DOLLAR}host;
        proxy_set_header    X-Forwarded-For         ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_pass_header   Set-Cookie;
        proxy_pass_header   P3P;
        proxy_buffering     off;
    }
}
